name: CI Build & Test Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Build & Integrity Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript & Lint Check
        run: npm run lint

      - name: Build Application (Vite Production)
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify Build Output
        run: |
          if [ -f dist/index.html ]; then
            echo "✅ Build verified successfully: dist/index.html is ready!"
          else
            echo "❌ Error: dist/index.html not found!"
            exit 1
          fi
